[project]
name = "dve"
version = "0.1.0"
description = "Deep learning for human variant pathogenicity prediction from DNA sequence."
authors = [{ name = "Ishan Maheshwari" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "biopython>=1.83",
    "pysam>=0.22",
    "pyfaidx>=0.8",
    "cyvcf2>=0.30",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.41",
    "datasets>=2.19",
    "accelerate>=0.30",
    "peft>=0.11",
    "evaluate>=0.4",
]
app = ["streamlit>=1.34", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.4", "pre-commit>=3.7", "ipykernel>=6.29", "jupyterlab>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dve"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
